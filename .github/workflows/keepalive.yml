name: Manter site acordado

# O plano gratuito do Render desliga o servidor após ~15 min sem visitas (a 1ª visita depois demora ~50 s
# e o que fica só na memória/disco do servidor, como o registro do chat, se perde). Acessa o site a cada 10 min.
# Um único serviço sempre ligado cabe nas horas mensais gratuitas do Render.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: snapshots.py
          sparse-checkout-cone-mode: false
      - name: Acessar o site
        run: |
          # endereço do site: fonte única em snapshots.py (APP_URL)
          URL=$(grep -oP 'APP_API", "\K[^"]+' snapshots.py)
          echo "site: $URL"
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$URL/api/status" || true)
            echo "tentativa $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "::warning::site não respondeu 200 (HTTP $code)"
