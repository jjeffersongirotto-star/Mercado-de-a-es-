// App Android do JG Investing: abre o site em tela cheia (WebView) e traz o widget ★ Favoritos.
// Nome, cor e ícone vêm das fontes do site (AGENTS.md, tabela 1.3): <title> e theme-color do index.html,
// endereço de snapshots.py (APP_URL) e os PNG gerados em static/icons/ (scripts/build_icons.py).
plugins { id "com.android.application" }

def site = rootProject.file("..")
def html = new File(site, "index.html").getText("UTF-8")
def appName = (html =~ /<title>(.*?)<\/title>/)[0][1].split(" — ")[0]
def themeColor = (html =~ /<meta name="theme-color" content="([^"]+)"/)[0][1]
// cores do design system do site (index.html → :root { --c-pos … }) usadas no widget
def cssColor = { String name ->
    def m = (html =~ ("--" + name + /:\s*rgb\((\d+) (\d+) (\d+)\)/))[0]
    String.format("#%02x%02x%02x", m[1] as int, m[2] as int, m[3] as int)
}
// cor da linha da ação no gráfico do site (grafico.js → SERIES, id 'stock')
def chartStock = (new File(site, "grafico.js").getText("UTF-8") =~ /id: 'stock'[^}]*color: '(#[0-9a-fA-F]{6})'/)[0][1]
def appUrl = (new File(site, "snapshots.py").getText("UTF-8") =~ /"(https:\/\/[^"]+onrender\.com)"/)[0][1]

// Assinatura: arquivo de propriedades FORA do repositório (storeFile, storePassword, keyAlias, keyPassword),
// indicado pela variável de ambiente JG_SIGNING. Sem ela, o release sai sem assinatura.
def signProps = System.getenv("JG_SIGNING") ? new File(System.getenv("JG_SIGNING")) : null

def iconsOut = layout.buildDirectory.dir("generated/res/icons")
def copyIcons = tasks.register("copyIcons", Copy) {
    from(new File(site, "static/icons")) {
        include "maskable-512.png", "icon-512.png"
        rename "maskable-512.png", "ic_fg.png"
        rename "icon-512.png", "ic_legacy.png"
    }
    from(new File(site, "static/brand")) {  // marca comprida do topo do widget (scripts/build_icons.py → marca_widget)
        include "jg-investing-widget.png", "jg-investing-widget-nome.png", "jg-investing-widget-graf.png"
        rename "jg-investing-widget.png", "ic_brand.png"
        rename "jg-investing-widget-nome.png", "ic_brand_nome.png"
        rename "jg-investing-widget-graf.png", "ic_brand_graf.png"
    }
    into iconsOut.map { it.dir("drawable-nodpi") }
}

android {
    namespace "com.jginvesting.app"
    compileSdk 36
    defaultConfig {
        applicationId "com.jginvesting.app"
        minSdk 24
        targetSdk 36
        versionCode 19
        versionName "1.18"
        resValue "string", "app_name", appName
        resValue "color", "theme", themeColor
        resValue "color", "chart_stock", chartStock
        ["c-pos", "c-neg", "c-amber", "c-orange", "c-lime", "c-txt", "c-mut", "c-dim", "bg-in", "bg-sec", "bd"].each { resValue "color", it.replace("-", "_"), cssColor(it) }
        buildConfigField "String", "SITE", "\"" + appUrl + "\""
    }
    buildFeatures { buildConfig true }
    sourceSets { main { res.srcDirs += iconsOut.get().asFile } }
    signingConfigs {
        release {
            if (signProps != null && signProps.exists()) {
                def p = new Properties(); signProps.withInputStream { p.load(it) }
                storeFile new File(p.getProperty("storeFile"))
                storePassword p.getProperty("storePassword")
                keyAlias p.getProperty("keyAlias")
                keyPassword p.getProperty("keyPassword")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (signProps != null && signProps.exists()) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.returnDefaultValues = true }
}
tasks.named("preBuild") { dependsOn copyIcons }

// APK assinado -> static/app/JG-Investing.apk: o site o oferece em /app.apk (ⓘ → App Android) com a versão de versionName
// + static/app/version.json (versionCode, versionName, apk, sha256): o app compara com a própria versão e oferece atualizar
def publishApk = tasks.register("publishApk", Copy) {
    onlyIf { signProps != null && signProps.exists() }
    from layout.buildDirectory.file("outputs/apk/release/app-release.apk")
    into new File(site, "static/app")
    rename { "JG-Investing.apk" }
    def vc = android.defaultConfig.versionCode, vn = android.defaultConfig.versionName
    doLast {
        def apk = new File(site, "static/app/JG-Investing.apk")
        def sha = java.security.MessageDigest.getInstance("SHA-256").digest(apk.bytes).encodeHex().toString()
        new File(site, "static/app/version.json").setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(
            [versionCode: vc, versionName: vn, apk: "/app.apk", sha256: sha])) + "\n", "UTF-8")
    }
}
afterEvaluate { tasks.named("assembleRelease") { finalizedBy publishApk } }

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}
